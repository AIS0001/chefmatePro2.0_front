<!DOCTYPE html>
<html>
<head>
    <title>KOT Print Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        button { background: #007cba; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #005a87; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>🖨️ KOT Print Test</h1>
    
    <div>
        <h3>Server Status</h3>
        <button onclick="checkServer()">Check Server Status</button>
        <div id="server-status"></div>
    </div>
    
    <div>
        <h3>Available Printers</h3>
        <button onclick="listPrinters()">List Printers</button>
        <div id="printer-list"></div>
    </div>
    
    <div>
        <h3>Test Print</h3>
        <button onclick="testPrint()">Send Test Print to 3 CP-Q1UN PINGU</button>
        <button onclick="testSimple()">Send Simple Text Print</button>
        <div id="test-result"></div>
    </div>
    
    <div>
        <h3>KOT Print Test</h3>
        <button onclick="printKOT()">Print Sample KOT</button>
        <div id="kot-result"></div>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:5000';
        
        function showResult(elementId, content, type = 'success') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
        }
        
        async function checkServer() {
            try {
                const response = await fetch(`${SERVER_URL}/health`);
                const data = await response.json();
                showResult('server-status', data, 'success');
            } catch (error) {
                showResult('server-status', `Error: ${error.message}`, 'error');
            }
        }
        
        async function listPrinters() {
            try {
                const response = await fetch(`${SERVER_URL}/printers`);
                const data = await response.json();
                showResult('printer-list', data, 'success');
            } catch (error) {
                showResult('printer-list', `Error: ${error.message}`, 'error');
            }
        }
        
        async function testPrint() {
            try {
                const response = await fetch(`${SERVER_URL}/test-print`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ printerName: '3 CP-Q1UN PINGU' })
                });
                const data = await response.json();
                showResult('test-result', data, data.success ? 'success' : 'error');
            } catch (error) {
                showResult('test-result', `Error: ${error.message}`, 'error');
            }
        }
        
        async function testSimple() {
            try {
                const response = await fetch(`${SERVER_URL}/test-simple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ printerName: '3 CP-Q1UN PINGU' })
                });
                const data = await response.json();
                showResult('test-result', data, data.success ? 'success' : 'error');
            } catch (error) {
                showResult('test-result', `Error: ${error.message}`, 'error');
            }
        }
        
        async function printKOT() {
            const kotData = {
                table: 'Table 5',
                orderNumber: 'KOT-TEST-' + Date.now(),
                items: [
                    { item_name: 'Chicken Curry', quantity: 2, notes: 'Spicy' },
                    { item_name: 'Rice', quantity: 2 },
                    { item_name: 'Naan', quantity: 4 }
                ],
                total: '₹450.00'
            };
            
            try {
                const response = await fetch(`${SERVER_URL}/print-kot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(kotData)
                });
                const data = await response.json();
                showResult('kot-result', data, data.success ? 'success' : 'error');
            } catch (error) {
                showResult('kot-result', `Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-check server on load
        window.onload = checkServer;
    </script>
</body>
</html>
